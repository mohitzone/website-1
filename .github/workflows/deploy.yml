name: Build and Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate config.js from secrets
        run: |
          cat > ./website-1/config.js <<EOF
          window.CONFIG = window.CONFIG || {};
          window.CONFIG.YOUTUBE = {
            apiKey: "${{ secrets.YOUTUBE_API_KEY }}",
            channelId: "${{ secrets.YOUTUBE_CHANNEL_ID }}"
          };
          window.CONFIG.GA_MEASUREMENT_ID = "${{ secrets.GA_MEASUREMENT_ID }}";
          EOF

      # Add your build and deploy steps below
      # - name: Build
      #   run: npm install && npm run build
      # - name: Deploy
      #   run: ...
