name: Generate Config

on:
  workflow_dispatch:

jobs:
  generate-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate config.js from GitHub Variables
        run: |
          mkdir -p ./website-1
          cat > ./website-1/config.js <<EOF
          window.CONFIG = window.CONFIG || {};
          window.CONFIG.YOUTUBE = {
            apiKey: "${{ vars.YOUTUBE_API_KEY }}",
            channelId: "${{ vars.YOUTUBE_CHANNEL_ID }}"
          };
          window.CONFIG.GA_MEASUREMENT_ID = "${{ vars.GA_MEASUREMENT_ID }}";
          EOF

      - name: Upload config.js as artifact
        uses: actions/upload-artifact@v4
        with:
          name: config-js
          path: ./website-1/config.js
