<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>संत का विवरण</title>
    <link rel="stylesheet" href="style.css">
    <style>
      body {
        background: #fdf6e3;
        font-family: 'Arial', sans-serif;
      }
      .saint-detail-card {
        max-width: 600px;
        margin: 40px auto;
        background: linear-gradient(135deg, #ffeaa7, #fab1a0);
        border-radius: 18px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        padding: 2.5rem 2rem;
        text-align: center;
        position: relative;
      }
      #saint-image {
        width: 220px;
        height: 220px;
        object-fit: cover;
        border-radius: 50%;
        box-shadow: 0 4px 16px rgba(0,0,0,0.13);
        margin-bottom: 1.5rem;
        border: 6px solid #fff;
      }
      #saint-name {
        font-size: 2.1rem;
        color: #d35400;
        margin-bottom: 1.2rem;
        font-weight: bold;
        letter-spacing: 1px;
        text-shadow: 1px 1px 6px rgba(0,0,0,0.07);
      }
      #saint-description {
        font-size: 1.08rem;
        color: #333;
        text-align: left;
        background: rgba(255,255,255,0.7);
        border-radius: 10px;
        padding: 1.2rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        margin-top: 1rem;
        line-height: 1.7;
      }
      @media (max-width: 700px) {
        .saint-detail-card {
          padding: 1.2rem 0.5rem;
        }
        #saint-image {
          width: 140px;
          height: 140px;
        }
        #saint-name {
          font-size: 1.3rem;
        }
        #saint-description {
          font-size: 0.98rem;
        }
      }
    </style>
</head>
<body>
    <section id="saint-detail" class="section">
      <div class="saint-detail-card">
        <img id="saint-image" alt="">
        <h1 id="saint-name"></h1>
        <div id="saint-description"></div>
      </div>
    </section>

    <script src="saints-data.js"></script>
    <script src="saint-detail.js"></script>
</body>
</html>
